name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  VAULT_ADDR: https://vault.qa.guru
  HARBOR_REGISTRY: harbor.qa.guru
  HARBOR_PROJECT: qa-guru-internal
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Import Harbor credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v3
        continue-on-error: true
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/arc/harbor_credentials username | HARBOR_USERNAME ;
            kv/data/arc/harbor_credentials password | HARBOR_PASSWORD

      - name: Log in to Harbor
        shell: bash
        env:
          VAULT_USER: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          VAULT_PASS: ${{ steps.vault.outputs.HARBOR_PASSWORD }}
          GH_USER: ${{ secrets.HARBOR_USERNAME }}
          GH_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          USER="${VAULT_USER:-}"
          PASS="${VAULT_PASS:-}"
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            USER="${GH_USER:-}"
            PASS="${GH_PASS:-}"
          fi
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Harbor credentials missing. Add repository secrets HARBOR_USERNAME and HARBOR_PASSWORD, or restore Vault access / arc-runner-set."
            exit 1
          fi
          printf '%s\n' "$PASS" | docker login "$HARBOR_REGISTRY" -u "$USER" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:latest
          build-args: |
            PYTHON_VERSION=3.12

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Package and push Helm chart
        shell: bash
        env:
          VAULT_USER: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          VAULT_PASS: ${{ steps.vault.outputs.HARBOR_PASSWORD }}
          GH_USER: ${{ secrets.HARBOR_USERNAME }}
          GH_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          USER="${VAULT_USER:-${GH_USER:-}}"
          PASS="${VAULT_PASS:-${GH_PASS:-}}"
          cd helm
          helm package book-club --version "1.0.${GITHUB_RUN_NUMBER}" --app-version "${IMAGE_TAG}"
          printf '%s\n' "$PASS" | helm registry login "${HARBOR_REGISTRY}" \
            --username "${USER}" \
            --password-stdin
          helm push "book-club-1.0.${GITHUB_RUN_NUMBER}.tgz" "oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}"

      - name: Prune local Docker cache
        if: always()
        run: docker system prune -af --volumes || true
