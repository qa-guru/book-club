name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VAULT_ADDR: https://vault.qa.guru
  HARBOR_REGISTRY: harbor.qa.guru
  HARBOR_PROJECT: qa-guru-internal
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Import Harbor credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/arc/harbor_credentials username | HARBOR_USERNAME ;
            kv/data/arc/harbor_credentials password | HARBOR_PASSWORD

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:latest
          build-args: |
            PYTHON_VERSION=3.12

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          cd helm
          helm package book-club --version "1.0.${GITHUB_RUN_NUMBER}" --app-version "${IMAGE_TAG}"
          printf '%s\n' "${HARBOR_PASSWORD}" | helm registry login "${HARBOR_REGISTRY}" \
            --username "${HARBOR_USERNAME}" \
            --password-stdin
          helm push "book-club-1.0.${GITHUB_RUN_NUMBER}.tgz" "oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}"

      - name: Prune local Docker cache
        if: always()
        run: docker system prune -af --volumes || true
