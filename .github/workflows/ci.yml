name: CI

on: [push]

jobs:
  test-compose:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: cleanup docker cache
        run: |
          docker system prune -af || true
      - name: run containers
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
      - name: wait for backend
        run: |
          until curl -fsS http://127.0.0.1:8000/api/v1/healthchecks/ >/dev/null; do sleep 2; done
      - name: wait for frontend
        run: |
          until curl -fsS http://127.0.0.1:8100/ >/dev/null; do sleep 2; done
      - name: configure host nginx
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null; then
            echo "nginx is not installed on runner, skipping host config"
            exit 0
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "passwordless sudo is required to reload host nginx"
            exit 0
          fi
          sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
          sudo cp deploy/nginx/book-club.conf /etc/nginx/sites-available/book-club.qa.guru
          sudo ln -sf /etc/nginx/sites-available/book-club.qa.guru /etc/nginx/sites-enabled/book-club.qa.guru
          sudo nginx -t
          sudo systemctl reload nginx
      - name: verify public site
        run: |
          curl -fsS --connect-timeout 5 --max-time 15 http://127.0.0.1:8100/ >/dev/null
          curl -fsS --connect-timeout 5 --max-time 15 http://127.0.0.1:8100/api/v1/healthchecks/ >/dev/null
          curl -fsS --connect-timeout 5 --max-time 15 http://127.0.0.1/ -H 'Host: book-club.qa.guru' >/dev/null
          curl -fsS --connect-timeout 5 --max-time 15 http://127.0.0.1/api/v1/healthchecks/ -H 'Host: book-club.qa.guru' >/dev/null
      - name: check DNS routing
        run: |
          RUNNER_IPV4="$(curl -4 -fsS --max-time 5 ifconfig.me || true)"
          RUNNER_IPV6="$(curl -6 -fsS --max-time 5 ifconfig.me || true)"
          DNS_IP="$(dig +short book-club.qa.guru A | tail -1)"
          echo "Runner public IPv4: ${RUNNER_IPV4:-unknown}"
          echo "Runner public IPv6: ${RUNNER_IPV6:-unknown}"
          echo "book-club.qa.guru DNS A: ${DNS_IP:-unknown}"
          if [ -n "$RUNNER_IPV4" ] && [ -n "$DNS_IP" ] && [ "$RUNNER_IPV4" != "$DNS_IP" ]; then
            echo "::warning::DNS for book-club.qa.guru points to ${DNS_IP}, but runner IPv4 is ${RUNNER_IPV4}."
          fi
          if curl -fsS --connect-timeout 5 --max-time 15 http://book-club.qa.guru/api/v1/healthchecks/ >/dev/null; then
            echo "Public domain is reachable from runner"
          else
            echo "::warning::Public domain is not reachable from runner; fix DNS or edge proxy in front of port 80"
          fi
      - name: Load Cloudflare DNS token from Vault
        id: vault_dns
        uses: hashicorp/vault-action@v3
        continue-on-error: true
        with:
          url: https://vault.qa.guru
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/arc/cloudflare_credentials token | CLOUDFLARE_API_TOKEN ;
            kv/data/arc/cloudflare token | CLOUDFLARE_API_TOKEN ;
            kv/data/arc/dns_credentials token | CLOUDFLARE_API_TOKEN
      - name: Update DNS to runner IPv4
        env:
          VAULT_DNS_TOKEN: ${{ steps.vault_dns.outputs.CLOUDFLARE_API_TOKEN }}
          GH_DNS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_IP="$(curl -4 -fsS --max-time 5 ifconfig.me)"
          CURRENT_IP="$(dig +short book-club.qa.guru A | tail -1)"
          if [ "$TARGET_IP" = "$CURRENT_IP" ]; then
            echo "DNS already points to runner IPv4 (${TARGET_IP})"
            exit 0
          fi
          export CLOUDFLARE_API_TOKEN="${VAULT_DNS_TOKEN:-${GH_DNS_TOKEN:-}}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare API token missing in Vault (kv/data/arc/cloudflare_credentials) or repo secret CLOUDFLARE_API_TOKEN"
            echo "::warning::Update book-club.qa.guru A record manually to ${TARGET_IP} (zone qa.guru is on Cloudflare)"
            exit 0
          fi
          chmod +x deploy/dns/update-cloudflare.sh
          deploy/dns/update-cloudflare.sh book-club.qa.guru "$TARGET_IP"
          sleep 10
          dig +short book-club.qa.guru A | tail -1
          curl -fsS --connect-timeout 10 --max-time 20 http://book-club.qa.guru/api/v1/healthchecks/